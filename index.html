<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해외 축구 정보</title>
<style>
:root{
--bg:#f5f6f8;--card:#fff;--text:#14151a;--sub:#6b7280;--line:#e5e7eb;
--accent:#1d4ed8;--accent-bg:#eef2ff;--win:#16a34a;--warn:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--text:#eef0f3;--sub:#9aa1ad;--line:#2a2e37;--accent:#7c9cff;--accent-bg:#1c2440;}
}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--text:#eef0f3;--sub:#9aa1ad;--line:#2a2e37;--accent:#7c9cff;--accent-bg:#1c2440;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Apple SD Gothic Neo",sans-serif;}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;}
h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;}
.starbtn{font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:5px 9px;cursor:pointer;}
.lg-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;}
.lg-tab{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;cursor:pointer;color:var(--text);white-space:nowrap;}
.lg-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.sub-tabs{display:flex;gap:0;border-top:1px solid var(--line);}
.sub-tab{flex:1;text-align:center;padding:10px 0;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;}
.sub-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
main{max-width:720px;margin:0 auto;padding:10px 14px 40px;}

.date-scroller{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 14px;}
.date-chip{flex:0 0 auto;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px;text-align:center;cursor:pointer;color:var(--text);}
.date-chip .dow{display:block;color:var(--sub);font-size:10px;}
.date-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.date-chip.active .dow{color:#dbe4ff;}

.pin-box{background:var(--accent-bg);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:14px;}
.pin-box .lbl{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:6px;}

.match{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;}
.match-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.match-head .time{width:50px;flex:0 0 50px;font-size:11px;color:var(--sub);}
.match-head .time b{display:block;font-size:13px;color:var(--text);}
.match-head .time .st{display:block;margin-top:2px;font-size:10px;}
.match-head .time .st.live{color:var(--warn);}
.teams{flex:1;min-width:0;}
.trow{display:flex;align-items:center;gap:8px;padding:2px 0;}
.badge{width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;}
.tname{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.tname.fav{font-weight:700;}
.tname.fav:after{content:" ★";color:#f5a623;}
.tscore{font-size:14px;font-weight:700;min-width:18px;text-align:right;}
.win .tname{font-weight:700;}

.pred{font-size:11px;color:var(--sub);text-align:right;flex:0 0 56px;line-height:1.4;}
.pred b{color:var(--accent);display:block;}

.detail{border-top:1px solid var(--line);padding:12px 14px 14px;font-size:13px;display:none;}
.detail.open{display:block;}
.detail .sum{color:var(--text);line-height:1.6;margin-bottom:12px;}
.statrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
.statrow .v{width:34px;text-align:center;font-weight:700;}
.bar{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden;display:flex;}
.bar .a{background:var(--accent);height:100%;}
.bar .b{background:var(--sub);opacity:.4;height:100%;}
.stat-label{text-align:center;font-size:11px;color:var(--sub);width:70px;flex:0 0 70px;}
.lineups{display:flex;gap:14px;margin-top:12px;}
.lu-col{flex:1;min-width:0;}
.lu-col h4{font-size:12px;margin:0 0 6px;color:var(--sub);}
.lu-col ul{margin:0;padding:0;list-style:none;font-size:12px;line-height:1.9;}
.lu-col li span{color:var(--sub);font-size:10px;}
.empty-note{color:var(--sub);font-size:12px;padding:6px 0;}

.standings{width:100%;border-collapse:collapse;font-size:13px;}
.standings th{font-size:11px;color:var(--sub);font-weight:600;padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);}
.standings td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);}
.standings td.rank{width:22px;color:var(--sub);}
.standings td.team{text-align:left;display:flex;align-items:center;gap:6px;}
.standings tr.fav-row{background:var(--accent-bg);}

.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:50;}
.picker-overlay.open{display:flex;}
.picker{background:var(--card);width:100%;max-height:70vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;}
.picker h3{margin:0 0 10px;font-size:15px;}
.picker select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;margin-bottom:10px;}
.picker button{width:100%;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;}
footer{text-align:center;color:var(--sub);font-size:11px;padding:10px 16px 30px;}
</style>
</head>
<body>
<header>
<h1>⚽ 해외 축구 정보 <button class="starbtn" id="favBtn">★ 응원팀</button></h1>
<div class="lg-tabs" id="lgTabs"></div>
<div class="sub-tabs">
<div class="sub-tab active" data-sub="sched">일정</div>
<div class="sub-tab" data-sub="stand">순위</div>
</div>
</header>
<main id="main"></main>
<footer>경기 정보는 스냅샷 데이터이며(기준 2026-09-22), 일부 경기만 상세 기록을 제공합니다. 일정·라인업은 변경될 수 있습니다.</footer>

<div class="picker-overlay" id="pickerOv">
<div class="picker">
<h3>응원하는 팀을 선택하세요</h3>
<select id="favSelect"></select>
<button id="favSave">저장</button>
</div>
</div>

let curLeague='epl', curSub='sched', curDate=null, fav=null;
try{fav=localStorage.getItem('favTeam')||null;}catch(e){}

function allTeams(){
const set=new Map();
Object.entries(LEAGUES).forEach(([lk,lg])=>{
lg.standings.forEach(s=>{ if(!set.has(s[0])) set.set(s[0], lg.label); });
});
return set;
}
function favLeagueKey(){
if(!fav) return null;
for(const [lk,lg] of Object.entries(LEAGUES)){
if(lg.standings.some(s=>s[0]===fav) || lg.matches.some(m=>m.h===fav||m.a===fav)) return lk;
}
return null;
}

function renderLgTabs(){
const el=document.getElementById('lgTabs');
el.innerHTML='';
Object.entries(LEAGUES).forEach(([key,lg])=>{
const b=document.createElement('button');
b.className='lg-tab'+(key===curLeague?' active':'');
b.textContent=lg.label;
b.onclick=()=>{curLeague=key;curDate=null;render();};
el.appendChild(b);
});
}

document.querySelectorAll('.sub-tab').forEach(t=>{
t.onclick=()=>{curSub=t.dataset.sub;document.querySelectorAll('.sub-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');render();};
});

function teamRow(name,score,isWin,predSide){
const d=document.createElement('div');
d.className='trow'+(isWin?' win':'');
const b=document.createElement('div');
b.className='badge'; b.style.background=color(name); b.textContent=abbr(name);
const nm=document.createElement('div');
nm.className='tname'+(name===fav?' fav':'');
nm.textContent=kr(name);
nm.onclick=(e)=>{e.stopPropagation(); if(predSide!==undefined) predSide();};
const sc=document.createElement('div');
sc.className='tscore'; sc.textContent = score===null?'':score;
d.appendChild(b); d.appendChild(nm); d.appendChild(sc);
return d;
}

function buildDetail(m,box){
box.innerHTML='';
if(m.st==='sched'){
const p=document.createElement('div');
p.style.fontSize='13px';
const winner = m.hp>m.ap ? kr(m.h) : kr(m.a);
const pct = Math.max(m.hp,m.ap);
p.innerHTML=`🔮 AI 예상: <b style="color:var(--accent)">${winner}</b> 승리 가능성이 더 높습니다 (홈 ${m.hp}% · 무 ${m.dp}% · 원정 ${m.ap}%)`;
box.appendChild(p);
return;
}
const det = m.det && DETAILS[m.det];
if(!det){
const p=document.createElement('div');
p.className='empty-note';
p.textContent='이 경기의 상세 기록(스탯/라인업)은 이번 스냅샷에 포함되어 있지 않습니다. 최종 스코어만 제공됩니다.';
box.appendChild(p);
return;
}
const sum=document.createElement('div');
sum.className='sum'; sum.textContent=det.sum;
box.appendChild(sum);

function statRow(label,hv,av,suffix){
const row=document.createElement('div'); row.className='statrow';
const hvv=document.createElement('div'); hvv.className='v'; hvv.textContent=hv+(suffix||'');
const lbl=document.createElement('div'); lbl.className='stat-label'; lbl.textContent=label;
const bar=document.createElement('div'); bar.className='bar';
const tot=(hv+av)||1;
const a=document.createElement('div'); a.className='a'; a.style.width=(hv/tot*100)+'%';
const b=document.createElement('div'); b.className='b'; b.style.width=(av/tot*100)+'%';
bar.appendChild(a); bar.appendChild(b);
const avv=document.createElement('div'); avv.className='v'; avv.textContent=av+(suffix||'');
row.appendChild(hvv); row.appendChild(bar); row.appendChild(lbl); row.appendChild(document.createElement('div'));
row.lastChild.remove();
row.appendChild(avv);
box.appendChild(row);
}
statRow('점유율',det.st.h.pos,det.st.a.pos,'%');
statRow('슈팅',det.st.h.shots,det.st.a.shots);
statRow('유효슈팅',det.st.h.sot,det.st.a.sot);
statRow('코너킥',det.st.h.corn,det.st.a.corn);
statRow('옐로카드',det.st.h.yc,det.st.a.yc);

const lu=document.createElement('div'); lu.className='lineups';
const c1=document.createElement('div'); c1.className='lu-col';
c1.innerHTML=`<h4>${kr(m.h)} 라인업</h4><ul>`+det.lu.h.map(p=>`<li>${p.split('(')[0]}<span> ${p.match(/\((.*)\)/)[1]}</span></li>`).join('')+'</ul>';
const c2=document.createElement('div'); c2.className='lu-col';
c2.innerHTML=`<h4>${kr(m.a)} 라인업</h4><ul>`+det.lu.a.map(p=>`<li>${p.split('(')[0]}<span> ${p.match(/\((.*)\)/)[1]}</span></li>`).join('')+'</ul>';
lu.appendChild(c1); lu.appendChild(c2);
box.appendChild(lu);
}

function matchCard(m){
const card=document.createElement('div'); card.className='match';
const head=document.createElement('div'); head.className='match-head';
const time=document.createElement('div'); time.className='time';
time.innerHTML=`<b>${m.t}</b><span class="st${m.st==='final'?'':' '}">${m.st==='final'?'종료':'예정'}</span>`;
const teams=document.createElement('div'); teams.className='teams';
const hWin = m.st==='final' && m.hs>m.as;
const aWin = m.st==='final' && m.as>m.hs;
teams.appendChild(teamRow(m.h, m.st==='final'?m.hs:null, hWin));
teams.appendChild(teamRow(m.a, m.st==='final'?m.as:null, aWin));
head.appendChild(time); head.appendChild(teams);

if(m.st==='sched'){
const pr=document.createElement('div'); pr.className='pred';
pr.innerHTML='승률<br>'+m.hp+'% / '+m.ap+'%';
head.appendChild(pr);
}
card.appendChild(head);
const detBox=document.createElement('div'); detBox.className='detail';
card.appendChild(detBox);
head.onclick=()=>{
const open=detBox.classList.contains('open');
document.querySelectorAll('.detail.open').forEach(d=>d.classList.remove('open'));
if(!open){ buildDetail(m,detBox); detBox.classList.add('open'); }
};
return card;
}

function renderSchedule(){
const main=document.getElementById('main'); main.innerHTML='';
const lg=LEAGUES[curLeague];
const dates=[...new Set(lg.matches.map(m=>m.d))].sort();
if(!curDate || !dates.includes(curDate)){
const today='2026-09-22';
curDate = dates.find(d=>d>=today) || dates[dates.length-1];
}
// pinned favorite match
if(fav && favLeagueKey()===curLeague){
const favMatches = lg.matches.filter(m=>(m.h===fav||m.a===fav) && m.st==='sched').sort((a,b)=>a.d<b.d?-1:1);
if(favMatches.length){
const pin=document.createElement('div'); pin.className='pin-box';
pin.innerHTML=`<div class="lbl">★ ${kr(fav)} 다음 경기</div>`;
pin.appendChild(matchCard(favMatches[0]));
main.appendChild(pin);
}
}
const scroller=document.createElement('div'); scroller.className='date-scroller';
dates.forEach(d=>{
const lb=dlabel(d);
const chip=document.createElement('div');
chip.className='date-chip'+(d===curDate?' active':'');
chip.innerHTML=`${lb.mmdd}<span class="dow">${lb.dow}</span>`;
chip.onclick=()=>{curDate=d;render();};
scroller.appendChild(chip);
});
main.appendChild(scroller);
let dayMatches=lg.matches.filter(m=>m.d===curDate);
dayMatches=dayMatches.slice().sort((a,b)=>{
const af=fav&&(a.h===fav||a.a===fav), bf=fav&&(b.h===fav||b.a===fav);
if(af&&!bf) return -1; if(bf&&!af) return 1;
return a.t<b.t?-1:1;
});
if(!dayMatches.length){
const e=document.createElement('div'); e.className='empty-note'; e.textContent='이 날짜에 예정된 경기가 없습니다.';
main.appendChild(e);
}
dayMatches.forEach(m=> main.appendChild(matchCard(m)));
}

function renderStandings(){
const main=document.getElementById('main'); main.innerHTML='';
const lg=LEAGUES[curLeague];
const table=document.createElement('table'); table.className='standings';
table.innerHTML=`<tr><th>순위</th><th style="text-align:left">팀</th><th>승</th><th>무</th><th>패</th><th>승점</th></tr>`;
lg.standings.forEach((s,i)=>{
const [name,w,l,d,pts]=s;
const tr=document.createElement('tr');
if(name===fav) tr.className='fav-row';
tr.innerHTML=`<td class="rank">${i+1}</td><td class="team"><span class="badge" style="background:${color(name)};width:20px;height:20px;flex:0 0 20px;font-size:8px">${abbr(name)}</span>${kr(name)}${name===fav?' ★':''}</td><td>${w}</td><td>${d}</td><td>${l}</td><td><b>${pts}</b></td>`;
table.appendChild(tr);
});
main.appendChild(table);
}

function render(){
renderLgTabs();
if(curSub==='sched') renderSchedule(); else renderStandings();
}

// favorite team picker
const favBtn=document.getElementById('favBtn'), ov=document.getElementById('pickerOv'), sel=document.getElementById('favSelect'), saveBtn=document.getElementById('favSave');
function fillSelect(){
sel.innerHTML='<option value="">선택 안 함</option>';
Object.entries(LEAGUES).forEach(([lk,lg])=>{
const grp=document.createElement('optgroup'); grp.label=lg.label;
lg.standings.forEach(s=>{
const opt=document.createElement('option'); opt.value=s[0]; opt.textContent=kr(s[0]);
if(s[0]===fav) opt.selected=true;
grp.appendChild(opt);
});
sel.appendChild(grp);
});
}
favBtn.onclick=()=>{fillSelect(); ov.classList.add('open');};
ov.onclick=(e)=>{if(e.target===ov) ov.classList.remove('open');};
saveBtn.onclick=()=>{
fav = sel.value || null;
try{ if(fav) localStorage.setItem('favTeam',fav); else localStorage.removeItem('favTeam'); }catch(e){}
ov.classList.remove('open');
render();
};

render();
</script>
</body>
</html>
